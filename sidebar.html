<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="app">

    <!-- ── Header ────────────────────────────────── -->
    <header class="header">
      <div class="header-left">
        <svg class="header-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
        </svg>
        <span class="header-title">Translator</span>
      </div>
      <button class="settings-toggle" id="settingsToggle" title="设置" aria-label="打开设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.22-.07.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <!-- ── Settings Panel (collapsible) ──────────── -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-inner">
        <div class="setting-group">
          <label class="setting-label" for="apiKey">DeepL API Key</label>
          <div class="input-wrapper">
            <input type="password" id="apiKey" class="setting-input"
                   placeholder="输入您的 DeepL API Key…" autocomplete="off" spellcheck="false">
            <button class="eye-toggle" id="eyeToggle" title="显示 / 隐藏 Key" type="button">
              <!-- eye-open -->
              <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <!-- eye-closed -->
              <svg class="eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
          <div class="api-tier-group">
            <label class="tier-option">
              <input type="radio" name="apiTier" value="free" checked>
              <span class="tier-label">Free</span>
            </label>
            <label class="tier-option">
              <input type="radio" name="apiTier" value="pro">
              <span class="tier-label">Pro</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Language Bar ──────────────────────────── -->
    <div class="language-bar">
      <select id="sourceLang" class="lang-select" aria-label="源语言"></select>
      <button class="swap-btn" id="swapBtn" title="交换输入 / 输出语言" type="button" aria-label="交换语言">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3L4 7l4 4"/><path d="M4 7h16"/>
          <path d="M16 21l4-4-4-4"/><path d="M20 17H4"/>
        </svg>
      </button>
      <select id="targetLang" class="lang-select" aria-label="目标语言"></select>
    </div>

    <!-- ── Input ─────────────────────────────────── -->
    <div class="text-section input-section">
      <textarea id="sourceText" class="text-area" rows="5"
                placeholder="输入要翻译的文本…"></textarea>
      <div class="text-meta">
        <span class="char-count" id="charCount">0 字符</span>
        <button class="meta-btn clear-btn" id="clearBtn" title="清除文本" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Translate Button ──────────────────────── -->
    <button class="translate-btn" id="translateBtn" type="button">
      <span class="btn-text">翻 译</span>
      <div class="btn-loader" style="display:none">
        <div class="spinner"></div>
      </div>
    </button>

    <!-- ── Result ────────────────────────────────── -->
    <div class="text-section result-section" id="resultSection">
      <div class="detected-lang" id="detectedLang"></div>
      <div class="result-text" id="resultText"></div>
      <div class="text-meta">
        <span class="powered-by">Powered by DeepL</span>
        <button class="meta-btn copy-btn" id="copyBtn" title="复制翻译结果" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          <span>复制</span>
        </button>
      </div>
    </div>

    <!-- ── Toast ─────────────────────────────────── -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
